# /etc/cloudflared/config.yml
# Replace TUNNEL_ID with your actual tunnel UUID.
# Replace the credentials-file path with the JSON file generated by `cloudflared tunnel create`.
# Replace telnavi.example.com with your actual hostname.
tunnel: 12345678-aaaa-bbbb-cccc-1234567890ab
credentials-file: /root/.cloudflared/12345678-aaaa-bbbb-cccc-1234567890ab.json

ingress:
  - hostname: telnavi.example.com
    service: http://localhost:3000
  - service: http_status:404

